<div class="container">
    <h1><b>STOCK SEARCH</b></h1>
    <div class="row">
        <div class="col-5">
          <form class="example-form">
              <input matInput [formControl]="stockCodeControl" [matAutocomplete]="auto" placeholder="Enter stock code">
              <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
                <mat-option *ngFor="let option of filteredOptions" [value]="option.symbol">
                  {{ option.symbol }} - {{ option.description }}
                </mat-option>
              </mat-autocomplete>
            <button mat-button (click)="search()">Search</button>
            <button mat-button (click)="clear()">Clear</button>
          </form>
        </div>
    </div>
</div>
