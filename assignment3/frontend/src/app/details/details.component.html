<div class="container">
    <div *ngIf="spinner == true">
        <mat-spinner diameter="30"></mat-spinner>
    </div>
    <div *ngIf="spinner == false">
    <div *ngIf="success != true; else result_block" class="alert alert-danger" role="alert">
        No results found. Please enter valid Ticker
    </div>
    <ng-template #result_block>
        <p>Success</p>
    </ng-template>
</div>
