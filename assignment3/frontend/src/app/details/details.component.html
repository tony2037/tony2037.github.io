<div class="container">
    <div *ngIf="spinner == true">
        <mat-spinner diameter="30"></mat-spinner>
    </div>
    <div *ngIf="spinner == false">
    <div *ngIf="success != true; else result_block" class="alert alert-danger" role="alert">
        No results found. Please enter valid Ticker
    </div>
    <ng-template #result_block>
        <div class="row">
            <div class="col-4">
                <span><b> {{ticker}} </b></span>
                <span> {{companyName}} </span>
                <span> {{exchangeCode}} </span>
                <button (click)="buyit()" type="button" class="btn btn-success">Buy</button>
                <button (click)="sellit()" type="button" class="btn btn-danger">Sell</button>
            </div>
            <div class="col-4"><img [src]="logoUrl" alt="Company Logo"></div>
            <div class="col-4">
                <span> {{lastPrice}} </span>
                <span> {{change}} ({{changePercentage}}%) </span>
                <span> {{currentSecond}} </span>
            </div>
        </div>
        <div>
            <span *ngIf="marketStatus == false" style="color: red;">Market Closed on {{ lastDay }} 13:00:00</span>
            <span *ngIf="marketStatus == true" style="color: green;">Market is Open</span>
        </div>
        <mat-tab-group mat-stretch-tabs>
            <mat-tab label="Summary"> Summary </mat-tab>
            <mat-tab label="Top News"> Top News </mat-tab>
            <mat-tab label="Charts"> Charts </mat-tab>
            <mat-tab label="Insights"> Insights </mat-tab>
          </mat-tab-group>
    </ng-template>
</div>
