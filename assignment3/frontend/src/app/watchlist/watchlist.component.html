<div class="container">
    <div style="margin-top: 2em; margin-bottom: 2em;" class="row"><h2>My Watchlist</h2></div>
    <div *ngIf="spinner == true">
        <mat-spinner diameter="30"></mat-spinner>
    </div>
    <div *ngIf="spinner == false">
    <div *ngIf="watched_stocks.length === 0; else result_block" class="alert alert-warning" role="alert">
        Currently you don't have any stock in your watchlist.
    </div>
    <ng-template #result_block>
        <div class="row">
            <div style="margin-top: 1em; border-style: solid; border-radius: 1em;" *ngFor="let stock of watched_stocks" class="col-8">
                <button (click)="onClickClear(stock.ticker)" style="width: 1em; height: 1em; background-color: transparent; border-style: none;" class="clear-button">
                    <span style="color: black;">&#10006;</span>
                </button>
                <div style="border-style: none;" class="card">
                    <div (click)="onClickCard(stock.ticker)" class="card-body">
                        <div class="row">
                            <div class="col-6"><h5 class="card-title">{{ stock.ticker }}</h5></div>
                            <div class="col-6"><p class="card-text" [ngClass]="{'text-success': stock.change >= 0, 'text-danger': stock.change < 0}">{{ stock.price }}</p></div>
                        </div>
                        <div class="row">
                            <div class="col-6"><h6 class="card-subtitle mb-2">{{ stock.companyName }}</h6></div>
                            <div class="col-6">
                                <p class="card-text" [ngClass]="{'text-success': stock.change >= 0, 'text-danger': stock.change < 0}">
                                    <img *ngIf="stock.change >= 0" width="10" height="10" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Green_Arrow_Up.svg/1200px-Green_Arrow_Up.svg.png?20190502180104" alt="">
                                    <img *ngIf="stock.change < 0" width="10" height="10" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Red_Arrow_Down.svg/1200px-Red_Arrow_Down.svg.png?20070404214359" alt="">
                                    {{ stock.change }} ({{ stock.changePercentage }}%)
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</div>
