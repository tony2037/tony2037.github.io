runtime: nodejs20

handlers:
  - url: /api/.*
    script: auto

  - url: /(.*\.(css|js|gif|jpg|jpeg|png|ico|json|svg|woff|woff2|ttf|eot))
    static_files: frontend/dist/frontend/browser/\1
    upload: frontend/dist/frontend/browser/(.*\.(css|js|gif|jpg|jpeg|png|ico|json|svg|woff|woff2|ttf|eot))
    mime_type: text/plain

  - url: /.*
    static_files: frontend/dist/frontend/browser/index.html
    upload: frontend/dist/frontend/browser/index.html

env_variables:
  PORT: 8080

