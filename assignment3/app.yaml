runtime: nodejs20

handlers:
  - url: /api/.*
    script: auto

  - url: /(.*\.js)
    static_files: frontend/dist/frontend/browser/\1
    upload: frontend/dist/frontend/browser/(.*\.js)
    mime_type: application/javascript

  - url: /(.*\.css)
    static_files: frontend/dist/frontend/browser/\1
    upload: frontend/dist/frontend/browser/(.*\.css)
    mime_type: text/css

  - url: /(.*\.(gif|jpg|jpeg|png|ico|json|svg|woff|woff2|ttf|eot))
    static_files: frontend/dist/frontend/browser/\1
    upload: frontend/dist/frontend/browser/(.*\.(gif|jpg|jpeg|png|ico|json|svg|woff|woff2|ttf|eot))
    mime_type: text/plain

  - url: /.*
    static_files: frontend/dist/frontend/browser/index.html
    upload: frontend/dist/frontend/browser/index.html

env_variables:
  PORT: 8080

